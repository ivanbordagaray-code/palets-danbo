<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palets Barra Danbo</title>
<link rel="icon" type="image/png" href="img/icono.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabecera fija con pestañas; tablero de palets en grilla; formularios y tablas en paneles anchos. Estética de cámara frigorífica: gris azulado frío, teal para acciones, amarillo queso solo en las barras de stock. */
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;
  --surface2: #F4F7F8;
  --ink: #12222C;
  --ink2: #4B5F6B;
  --line: #D3DDE2;
  --accent: #0B5C73;
  --accent-ink: #FFFFFF;
  --cheese: #F0C23A;
  --ok: #2B7A4B;
  --warn: #B45309;
  --bad: #B42318;
  --ok-bg: #E4F3EA;
  --warn-bg: #FBEBD6;
  --bad-bg: #FBE3E0;
  --info-bg: #DDEEF3;
  --f-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E171C; --surface: #16232A; --surface2: #1B2B33; --ink: #E6EEF1; --ink2: #9FB3BD; --line: #2A3C45;
    --accent: #5CC0D9; --accent-ink: #06222B; --cheese: #E8B92E; --ok: #5CC389; --warn: #F0A04B; --bad: #FF8A7A;
    --ok-bg: #153325; --warn-bg: #3A2A12; --bad-bg: #3B1B18; --info-bg: #12303A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E171C; --surface: #16232A; --surface2: #1B2B33; --ink: #E6EEF1; --ink2: #9FB3BD; --line: #2A3C45;
  --accent: #5CC0D9; --accent-ink: #06222B; --cheese: #E8B92E; --ok: #5CC389; --warn: #F0A04B; --bad: #FF8A7A;
  --ok-bg: #153325; --warn-bg: #3A2A12; --bad-bg: #3B1B18; --info-bg: #12303A;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 0 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.muted { color: var(--ink2); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* cabecera */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: 14px; }
.brandbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; background: linear-gradient(135deg, #0F2342 0%, #1B3E6B 100%); border-radius: 10px; padding: 10px 16px; margin-bottom: 4px; box-shadow: 0 1px 0 rgba(255,255,255,.08) inset, 0 2px 8px rgba(15,35,66,.18); border-bottom: 3px solid var(--cheese); }
.logochip { background: #fff; border-radius: 8px; padding: 5px 10px; display: flex; align-items: center; justify-content: center; flex: none; }
.logochip img { display: block; height: 48px; width: auto; }
.brandtitle { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 4px; min-width: 0; }
.brandtitle .stencil { color: #fff; }
.brandtitle .brandsub { color: #BFD0E6; }
@media (max-width: 640px) {
  .brandbar { padding: 8px 10px; gap: 8px; }
  .logochip { padding: 4px 6px; }
  .logochip img { height: 28px; }
  .brandtitle .stencil { font-size: 22px; }
  .brandtitle .brandsub { display: none; }
}
.stencil { font-family: var(--f-display); font-weight: 700; font-size: 30px; letter-spacing: .08em; text-transform: uppercase; line-height: 1; }
.brandsub { color: var(--ink2); font-size: 13px; letter-spacing: .02em; }
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-top: 10px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; font-weight: 500; color: var(--ink2); white-space: nowrap; display: inline-flex; gap: 8px; align-items: center; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:hover { color: var(--ink); }
.count { font-family: var(--f-mono); font-size: 11px; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 1px 7px; }
.count.bad { background: var(--bad); color: #fff; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

main { display: flex; flex-direction: column; gap: 28px; padding-top: 24px; }
.sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-bottom: 14px; }
.sechead h2 { font-family: var(--f-display); font-size: 26px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; margin-right: auto; }
.lead { color: var(--ink2); max-width: 65ch; }

/* resumen */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.stat { padding: 16px 20px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat .l { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); }
.stat .v { font-family: var(--f-display); font-size: 44px; font-weight: 600; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat .s { font-size: 12px; color: var(--ink2); }
@media (max-width: 720px) { .stat { border-right: 0; border-bottom: 1px solid var(--line); } .stat:last-child { border-bottom: 0; } }

/* alertas */
.alerts { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
.alerts header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.alerts header h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; margin-right: auto; }
.alerts ul { list-style: none; margin: 0; padding: 0; }
.alerts li { display: flex; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); align-items: flex-start; }
.alerts li:last-child { border-bottom: 0; }
.dot { flex: none; width: 10px; height: 10px; margin-top: 6px; border-radius: 50%; background: var(--warn); }
.dot.bad { background: var(--bad); border-radius: 2px; transform: rotate(45deg); }
.calm { padding: 14px 16px; color: var(--ok); display: flex; gap: 10px; align-items: center; }
.calm .dot { background: var(--ok); margin: 0; }

/* controles */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { appearance: none; background: none; border: 0; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
input[type="text"], input[type="date"], input[type="number"], input[type="search"], select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 5px; padding: 8px 10px; min-width: 0; width: 100%; }
textarea { min-height: 72px; resize: vertical; font-family: var(--f-mono); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }
.btn { appearance: none; border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 5px; padding: 8px 16px; font-weight: 600; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.btn.sec { background: transparent; color: var(--accent); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: transparent; }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .4; cursor: not-allowed; filter: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
.row > .field { flex: 1 1 160px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 18px; display: flex; flex-direction: column; gap: 16px; }
.panel h3 { font-family: var(--f-display); font-size: 20px; letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
@media (min-width: 900px) { .cols.two { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* palets */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.pal { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.pal.has-alert { border-color: var(--warn); }
.pal header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.num { font-family: var(--f-display); font-weight: 700; font-size: 38px; letter-spacing: .04em; line-height: 1; }
.num small { font-size: 14px; font-weight: 600; color: var(--ink2); margin-right: 4px; letter-spacing: .1em; }
.bar { height: 10px; border-radius: 2px; background: var(--surface2); border: 1px solid var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--cheese); }
.pal .big { font-size: 13px; color: var(--ink2); }
.pal .big b { font-family: var(--f-display); font-size: 28px; color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; margin-right: 2px; }
.pal .kg { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; }
.pal footer { color: var(--ink2); font-size: 12px; border-top: 1px dashed var(--line); padding-top: 8px; }
.hold { font-size: 12px; color: var(--accent); }
.al { font-size: 12px; padding: 4px 8px; border-radius: 4px; }
.al.warn { background: var(--warn-bg); color: var(--warn); }
.al.bad { background: var(--bad-bg); color: var(--bad); }
.chip { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.info { background: var(--info-bg); color: var(--accent); }
.chip.muted { background: var(--surface2); color: var(--ink2); border: 1px solid var(--line); }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 32px 20px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.empty h3 { font-family: var(--f-display); font-size: 24px; text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }

/* tablas */
.tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); font-weight: 600; padding: 9px 12px; background: var(--surface2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
td input, td select { padding: 5px 8px; }
td .kin { width: 96px; text-align: right; font-family: var(--f-mono); }
td .hint { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
tr.done td { color: var(--ink2); }
tfoot td { font-weight: 600; background: var(--surface2); }

.drop { border: 2px dashed var(--line); border-radius: 6px; padding: 32px 20px; text-align: center; cursor: pointer; display: flex; flex-direction: column; gap: 6px; align-items: center; background: var(--surface); }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--info-bg); }
.drop b { font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
.visually { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.checks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.checks li { display: flex; gap: 10px; align-items: flex-start; }
.checks .dot { margin-top: 5px; }
.checks .dot.ok { background: var(--ok); }
.checks .dot.info { background: var(--accent); }
details.panel summary { cursor: pointer; font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
.pedhead { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.pedhead h3 { margin-right: auto; }
.toast { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; pointer-events: none; padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.toast div { background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 6px; max-width: 560px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
.toast.bad div { background: var(--bad); color: #fff; }
.clis { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px dashed var(--line); display: flex; flex-direction: column; gap: 3px; font-size: 12px; }
.clis li { display: flex; justify-content: space-between; gap: 8px; }
.clis li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clis li b { font-family: var(--f-mono); font-weight: 500; white-space: nowrap; }
.clis .more { color: var(--ink2); }
.gate { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 16px; }
.gatebox { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; max-width: 360px; width: 100%; display: flex; flex-direction: column; gap: 14px; }
.gatelogo { height: 64px; width: auto; align-self: center; background: #fff; border-radius: 8px; padding: 6px 12px; }
.gatebox h2 { font-family: var(--f-display); font-size: 28px; text-transform: uppercase; letter-spacing: .04em; margin: 0; }
.gatemsg { color: var(--bad); min-height: 1.2em; margin: 0; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .25s ease; } }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brandbar"><span class="logochip"><img src="img/nor.png" alt="NOR Logística y Comercialización"></span><div class="brandtitle"><h1 class="stencil">Palets</h1><span class="brandsub">Barra Danbo · Tremblay en NOR</span></div><span class="logochip"><img src="img/tremblay.png" alt="Lácteos Tremblay"></span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav>
  </header>
  <main id="view"><p class="muted">Cargando…</p></main>
</div>
<div class="toast" id="toast" role="status" hidden><div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
window.PALETS_CONFIG = { API_URL: 'https://script.google.com/macros/s/AKfycbwTb8x37K3_LuK7MKMRSSus4YDjDTeWOFDNVtmcZF9ehdUjlVvFnoEfAw0UBCUk6oqA/exec' };
</script>
<script>
(function () {
  'use strict';
  var COLS = ['palets', 'salidas', 'remitos', 'pedidos', 'config'];
  var cache = {}, subs = {}, rev = null, loaded = false, loading = false, pending = 0, started = false;
  COLS.forEach(function (c) { cache[c] = {}; subs[c] = []; });

  function clone(x) { return x === undefined ? undefined : JSON.parse(JSON.stringify(x)); }
  function stable(x) {
    if (x === null || typeof x !== 'object') return JSON.stringify(x);
    if (Array.isArray(x)) return '[' + x.map(stable).join(',') + ']';
    return '{' + Object.keys(x).sort().map(function (k) { return JSON.stringify(k) + ':' + stable(x[k]); }).join(',') + '}';
  }
  function newId() { return 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  var CFG = window.PALETS_CONFIG || {};
  var clave = '', prefetched = null, accessP = null;
  function readClave() { try { return localStorage.getItem('palets_clave') || ''; } catch (e) { return ''; } }
  function saveClave(v) { try { localStorage.setItem('palets_clave', v); } catch (e) {} }
  function forgetClave() { try { localStorage.removeItem('palets_clave'); } catch (e) {} }
  function api(payload) {
    payload.clave = clave;
    return fetch(CFG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) return j.result;
        var e = (j && j.error) || 'error';
        throw { code: e === 'clave' ? 'clave' : 'unavailable', message: e };
      }, function (e) {
        throw { code: 'unavailable', message: String((e && e.message) || e) };
      });
  }
  function run(fn, args) {
    if (fn === 'getAll') {
      if (prefetched && !args[0]) { var p = prefetched; prefetched = null; return Promise.resolve(p); }
      return api({ action: 'getAll', rev: args[0] });
    }
    return api({ action: 'writeDoc', col: args[0], id: args[1], op: args[2], data: args[3] });
  }
  function hideGate() { var g = document.getElementById('gate'); if (g) { g.hidden = true; g.innerHTML = ''; } }
  function showGate(msg, attempt, fatal) {
    var g = document.getElementById('gate');
    if (!g) { g = document.createElement('div'); g.id = 'gate'; g.className = 'gate'; document.body.appendChild(g); }
    g.hidden = false;
    g.innerHTML = '<form class="gatebox" id="gate-form"><img class="gatelogo" src="img/nor.png" alt="NOR"><h2>Palets Barra Danbo</h2>' +
      (fatal ? '' : '<p class="muted">Ingresá la clave de acceso.</p><div class="field"><label for="gate-clave">Clave</label><input type="password" id="gate-clave" autocomplete="current-password"></div>') +
      '<p class="gatemsg" role="alert"></p>' + (fatal ? '' : '<button class="btn" type="submit">Entrar</button>') + '</form>';
    g.querySelector('.gatemsg').textContent = msg || '';
    if (fatal) return;
    var f = g.querySelector('#gate-form');
    f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var v = g.querySelector('#gate-clave').value;
      if (!v) return;
      var btn = f.querySelector('button'); btn.disabled = true;
      attempt(v, true);
    });
    setTimeout(function () { var i = g.querySelector('#gate-clave'); if (i) i.focus(); }, 0);
  }
  function ensureAccess() {
    if (accessP) return accessP;
    accessP = new Promise(function (resolve, reject) {
      if (!CFG.API_URL || String(CFG.API_URL).indexOf('http') !== 0) {
        showGate('Falta configurar la dirección del servidor en la página.', null, true);
        reject({ code: 'unavailable' });
        return;
      }
      function attempt(c, fromUi) {
        clave = c;
        return api({ action: 'getAll', rev: null }).then(function (res) {
          prefetched = res; saveClave(c); hideGate(); resolve();
        }, function (e) {
          if (e.code === 'clave') { forgetClave(); showGate(fromUi ? 'Clave incorrecta. Probá de nuevo.' : '', attempt); }
          else showGate('No se pudo conectar con el servidor. ' + (e.message || ''), attempt);
        });
      }
      var saved = readClave();
      if (saved) attempt(saved, false); else showGate('', attempt);
    });
    return accessP;
  }
  var META = { fromCache: false, hasPendingWrites: false };
  function docSnap(c, id) {
    var d = cache[c][id];
    return { id: id, exists: !!d, data: function () { return d; }, metadata: META };
  }
  function querySnap(c) {
    var docs = Object.keys(cache[c]).sort().map(function (id) { return docSnap(c, id); });
    return { docs: docs, size: docs.length, empty: !docs.length, docChanges: function () { return []; }, metadata: META };
  }
  function emit(c) { subs[c].slice().forEach(function (s) { try { s.fire(); } catch (e) { console.error(e); } }); }

  function load() {
    if (loading || pending > 0) return Promise.resolve();
    loading = true;
    return run('getAll', [rev]).then(function (res) {
      loading = false;
      if (pending > 0) return;
      var first = !loaded;
      if (!res.unchanged) {
        rev = res.rev;
        COLS.forEach(function (c) {
          var next = (res.data && res.data[c]) || {};
          if (stable(next) !== stable(cache[c])) { cache[c] = next; if (!first) emit(c); }
        });
      }
      if (first) { loaded = true; COLS.forEach(emit); }
    }, function (e) {
      loading = false;
      console.error(e);
      if (!loaded) {
        COLS.forEach(function (c) { subs[c].slice().forEach(function (s) { if (s.err) s.err({ code: 'unavailable', message: e.message }); }); });

  /* ---------- ingreso: validaciones ---------- */
  function parseNums(text) {
    var out = [], seen = {};
    String(text || '').split(/[,;\s]+/).filter(Boolean).forEach(function (t) {
      var m = t.match(/^(\d+)\s*[-–]\s*(\d+)$/);
      if (m && Number(m[2]) >= Number(m[1]) && Number(m[2]) - Number(m[1]) < 500) {
        var w = m[1].length;
        for (var n = Number(m[1]); n <= Number(m[2]); n++) { var s = String(n).padStart(w, '0'); out.push(s); }
      } else out.push(t);
    });
    return out;
  }
  function parseNumKg(text) {
    var out = [];
    String(text || '').split(/\r?\n/).forEach(function (line) {
      var m = line.match(/^\s*(\d+)\s*[\t;:=]\s*([\d.,]+)\s*(?:kg)?\s*$/i);
      if (m) out.push({ num: m[1], kilos: m[2] });
      else parseNums(line).forEach(function (n) { out.push({ num: n, kilos: '' }); });
    });
    return out;
  }
  function ingChecks() {
    var ing = state.ing, P = state.params, out = [];
    if (!ing.rows || !ing.rows.length) return out;
    var nums = ing.rows.map(function (r) { return String(r.num); }), seen = {}, dup = [];
    nums.forEach(function (n) { if (seen[n]) dup.push(n); seen[n] = 1; });
    if (dup.length) out.push({ k: 'bad', t: 'Número repetido en la lista: ' + dup.join(', ') + '.' });
    var abiertos = (state.D ? state.D.rows : []).filter(function (r) { return r.saldo > 0 && nums.indexOf(String(r.p.num)) >= 0; });
    if (abiertos.length) out.push({ k: 'bad', t: 'Ya hay palets en depósito con estos números: ' + abiertos.map(function (r) { return r.p.num; }).join(', ') + '.' });
    var cant = parseNum(ing.cant);
    if (cant != null && cant !== ing.rows.length) out.push({ k: 'warn', t: 'El remito dice ' + fmtN(cant) + ' palets y la lista tiene ' + ing.rows.length + '.' });
    var conK = ing.rows.filter(function (r) { return parseNum(r.kilos) != null; });
    var kr = parseNum(ing.kilos);
    if (conK.length) {
      var sum = conK.reduce(function (a, r) { return a + parseNum(r.kilos); }, 0);
      if (kr != null && conK.length === ing.rows.length && Math.abs(sum - kr) > P.difKilos) out.push({ k: 'warn', t: 'Los palets suman ' + fmtKg(sum) + ' y el remito dice ' + fmtKg(kr) + ' (diferencia ' + fmtKg(Math.abs(sum - kr)) + ').' });
      else if (kr != null && conK.length === ing.rows.length) out.push({ k: 'ok', t: 'Los kilos de los palets coinciden con el remito (' + fmtKg(sum) + ').' });
      if (conK.length < ing.rows.length) out.push({ k: 'info', t: (ing.rows.length - conK.length) + ' palets sin kilos: quedarán sin dato de kilos hasta que se pesen.' });
    } else out.push({ k: 'info', t: 'Ningún palet tiene kilos cargados. Se puede guardar igual.' });
    out.push({ k: 'info', t: ing.rows.length + ' palets × ' + P.cajasPalet + ' cajas = ' + fmtN(ing.rows.length * P.cajasPalet) + ' cajas (' + fmtN(ing.rows.length * P.cajasPalet * P.unidCaja) + ' unidades).' });
    return out;
  }

      refreshRow(d.ped, Number(d.i));
    }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.dataset && e.target.dataset.kilos !== undefined) {
      e.preventDefault();
      var all = Array.prototype.slice.call(document.querySelectorAll('[data-kilos]')), i = all.indexOf(e.target);
      if (all[i + 1]) all[i + 1].focus(); else e.target.blur();
    }
  });
  document.addEventListener('toggle', function (e) { if (e.target.id === 'pdet') state.paramsOpen = e.target.open; }, true);
  document.addEventListener('focusout', function () {
    setTimeout(function () { if (state.pending) schedule(); }, 0);
  });
  document.addEventListener('dragover', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) { e.preventDefault(); d.classList.add('over'); } });
  document.addEventListener('dragleave', function (e) { var d = e.target.closest && e.target.closest('#drop'); if (d) d.classList.remove('over'); });
  document.addEventListener('drop', function (e) {
    var d = e.target.closest && e.target.closest('#drop');
    if (d) { e.preventDefault(); d.classList.remove('over'); var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; if (f) loadFile(f); }
  });

  /* ---------- arranque ---------- */
  function boot() {
    if (!window.claude || !window.claude.use) { state.error = 'nodb'; render(); return; }
    Promise.all([window.claude.use('db'), window.claude.use('downloads')]).then(function (r) {
      var db = r[0]; state.dl = r[1];
      if (!db) { state.error = 'nodb'; render(); return; }
      state.db = db;
      function sub(col, key, sorter) {
        db.collection(col).onSnapshot(function (snap) {
          state[key] = snap.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
          if (sorter) state[key].sort(sorter);
          state.loaded[key] = true; schedule();
        }, function (err) { console.error(err); state.error = 'nodb'; render(); });
      }
      sub('palets', 'palets'); sub('salidas', 'salidas'); sub('remitos', 'remitos'); sub('pedidos', 'pedidos');
      db.doc('config/params').onSnapshot(function (s) {
        state.params = Object.assign({}, DEF, s.exists ? s.data() : {});
        state.loaded.params = true; schedule();
      }, function (err) { console.error(err); });
    }).catch(function (e) { console.error(e); state.error = 'nodb'; render(); });
  }
  boot();
})();
</script>
